bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

set-option -g mouse on
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
bind-key -n M--  split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key -n M-w kill-pane

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Colors (Tokyo Night inspired)
set -g status-style                "bg=#1e2030,fg=#c8d3f5"
set -g message-style               "bg=#82aaff,fg=#1e2030"
set -g message-command-style       "bg=#82aaff,fg=#1e2030"
set -g pane-border-style           "fg=#3b4261"
set -g pane-active-border-style    "fg=#82aaff"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#82aaff,fg=#1e2030,bold] #S #[bg=#1e2030,fg=#82aaff,nobold]  "

# Right: current path | date | time
set -g status-right-length 80
set -g status-right "#[fg=#636da6]#{=/-32/…:pane_current_path}  #[fg=#3b4261]│ #[fg=#c8d3f5]%m/%d %a #[fg=#3b4261]│ #[fg=#82aaff,bold]%H:%M "

# Window list
set -g window-status-separator ""
set -g window-status-format         " #I #W #[fg=#3b4261]│"
set -g window-status-current-format "#[bg=#2d3f76,fg=#82aaff,bold] #I #W #[bg=#1e2030,fg=#2d3f76]"
set -g window-status-style          "fg=#636da6"
set -g window-status-current-style  ""
set -g window-status-activity-style "fg=#ffc777,bold"
